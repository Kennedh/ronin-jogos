        "429":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Primeiro finish fixa final_tick/hash/motivo até expires_at. Retry idêntico não renova prazo.
        Partes faltantes podem chegar até upload_deadline; PENDING apenas após completude. Atraso do worker
        não altera elegibilidade semanal.
