openapi: 3.1.0
info:
  title: Ronin Runner API - contrato preliminar de design
  version: 0.25.0-foundation-draft
  description: |-
    API de fundação em desenvolvimento. Guest e runs implementados na1C; conta/Google/ranking/weekly permanecem contratos futuros. Prefixo /api/v1. Score somente após replay verificado; implantação não autorizada.
servers:
  - url: https://play.ronin.dev.br/api/v1
    description: Origem confirmada; implantação ainda não autorizada
tags:
  - name: Auth
    description: Contratos do domínio Auth
  - name: Profile
    description: Contratos do domínio Profile
  - name: Runs
    description: Contratos do domínio Runs
  - name: Leaderboards
    description: Contratos do domínio Leaderboards
  - name: Weekly
    description: Contratos do domínio Weekly
  - name: Operations
    description: Saúde operacional sem dados privados
security:
  - roninSession: []
paths:
  /auth/guest:
    post:
      operationId: post_auth_guest
      tags:
        - Auth
      summary: Criar ou reutilizar identidade visitante
      security: []
      responses:
        "200":
          description: Sessao de visitante restaurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"
          headers:
            X-CSRF-Token:
              description: Token sincronizado à sessão, para X-CSRF-Token nas mutações autenticadas. Cookie rr_sid é
                HttpOnly/host-only.
              schema:
                type: string
                pattern: ^[A-Za-z0-9_-]{43}$
        "201":
          description: Identidade visitante criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"
          headers:
            X-CSRF-Token:
              description: Token sincronizado à sessão, para X-CSRF-Token nas mutações autenticadas. Cookie rr_sid é
                HttpOnly/host-only.
              schema:
                type: string
                pattern: ^[A-Za-z0-9_-]{43}$
        "429":
          $ref: "#/components/responses/RateLimited"
        "400":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestRequest"
  /auth/verify-email/resend:
    post:
      operationId: resendEmail
      tags: [Auth]
      summary: Reenviar confirmacao com cooldown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendEmailRequest"
      responses:
        "202":
          description: Resposta de identidade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/reauth:
    post:
      operationId: reauthEmail
      tags: [Auth]
      summary: Confirmar senha para operacoes sensiveis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "204":
          description: Resposta de identidade
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/register:
    post:
      operationId: registerEmail
      tags: [Auth]
      summary: Solicitar cadastro sem enumeracao de contas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Resposta de identidade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/login:
    post:
      operationId: loginEmail
      tags: [Auth]
      summary: Entrar com email e senha verificados
      security: []
      description: Origin exata, JSON e header X-Ronin-Auth 1 obrigatorios; nao aceita formulario cross-site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginRequest"
      responses:
        "200":
          description: Resposta de identidade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/google:
    post:
      operationId: post_auth_google
      tags:
        - Auth
      summary: Login com credencial do Google verificada no servidor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_token
                - csrf_proof
              properties:
                id_token:
                  type: string
                  minLength: 1
                csrf_proof:
                  type: string
                  minLength: 1
              additionalProperties: false
      responses:
        "200":
          description: Identidade Google autenticada e vinculada ao sub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Auth]
      summary: Confirmar email no contexto do cadastro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "204":
          description: Resposta de identidade
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Pedir recuperacao sem enumeracao
      security: []
      description: Origin exata, JSON e header X-Ronin-Auth 1 obrigatorios; nao aceita formulario cross-site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Resposta de identidade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Redefinir senha e revogar sessoes, sem login automatico
      security: []
      description: Origin exata, JSON e header X-Ronin-Auth 1 obrigatorios; nao aceita formulario cross-site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Resposta de identidade
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      operationId: logoutEmail
      tags: [Auth]
      summary: Encerrar sessao atual
      description: Exige Origin autorizado, JSON e X-Ronin-Auth 1; sessao valida tambem exige CSRF. Cookie ausente ou expirado e limpo sem autenticar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "204":
          description: Resposta de identidade
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/merge/preview:
    post:
      operationId: post_auth_merge_preview
      tags:
        - Auth
      summary: Consultar potencial mesclagem com prova de ambas identidades
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_session_proof
              properties:
                target_session_proof:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: Comparativo sem modificar dados
          content:
            application/json:
              schema:
                type: object
                required:
                  - merge_nonce
                  - source_player_id
                  - target_player_id
                properties:
                  merge_nonce:
                    type: string
                  source_player_id:
                    type: string
                    format: uuid
                  target_player_id:
                    type: string
                    format: uuid
                  summary:
                    type: object
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/merge/confirm:
    post:
      operationId: post_auth_merge_confirm
      tags:
        - Auth
      summary: Mesclar duas identidades autenticadas com idempotencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - merge_nonce
                - confirmed
              properties:
                merge_nonce:
                  type: string
                confirmed:
                  type: boolean
                  const: true
              additionalProperties: false
      responses:
        "200":
          description: Perfil canonico, sem duplicar eventos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/link:
    post:
      operationId: post_auth_link
      tags:
        - Auth
      summary: Vincular Google ou email a identidade autenticada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - proof
              properties:
                method:
                  type: string
                  enum:
                    - EMAIL
                    - GOOGLE
                proof:
                  type: string
                  description: Prova de posse validada no servidor
              additionalProperties: false
      responses:
        "200":
          description: Metodo associado, sessao rotacionada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /me/sessions:
    get:
      operationId: listSessions
      tags: [Auth]
      summary: Listar sessoes proprias com autenticacao recente
      responses:
        "200":
          description: Resposta de identidade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSessions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me/sessions/{session_id}:
    delete:
      operationId: revokeAccountSession
      tags: [Auth]
      summary: Revogar sessao propria com autenticacao recente
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Sessao encerrada}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /me/preferences:
    patch:
      operationId: patch_me_preferences
      tags:
        - Profile
      summary: Idioma, som, acessibilidade e qualidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum:
                    - pt-BR
                    - en
                reduced_motion:
                  type: boolean
                graphics_quality:
                  type: string
                  enum:
                    - AUTO
                    - LOW
                    - HIGH
                music_volume:
                  type: number
                  minimum: 0
                  maximum: 1
                effects_volume:
                  type: number
                  minimum: 0
                  maximum: 1
              additionalProperties: false
      responses:
        "200":
          description: Preferencias persistidas
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /me/progress:
    get:
      operationId: get_me_progress
      tags:
        - Profile
      summary: Metricas de carreira e regioes desbloqueadas verificadas
      responses:
        "200":
          description: Progresso e marcos
          content:
            application/json:
              schema:
                type: object
                required:
                  - verified_distance_m
                  - verified_perfect_slashes
                  - verified_kills
                  - unlocked_regions
                properties:
                  verified_distance_m:
                    type: integer
                    minimum: 0
                  verified_perfect_slashes:
                    type: integer
                    minimum: 0
                  verified_kills:
                    type: integer
                    minimum: 0
                  unlocked_regions:
                    type: array
                    items:
                      type: string
  /me/missions:
    get:
      operationId: get_me_missions
      tags:
        - Profile
      summary: Catalogo de missoes e progresso confiavel
      responses:
        "200":
          description: Progresso das missoes
          content:
            application/json:
              schema:
                type: object
                properties:
                  missions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /me/achievements:
    get:
      operationId: get_me_achievements
      tags:
        - Profile
      summary: Conquistas e quatro selos de chefes
      responses:
        "200":
          description: Conquistas concedidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  achievements:
                    type: array
                    items:
                      type: string
                  boss_seals:
                    type: array
                    items:
                      type: string
  /me/bosses:
    get:
      operationId: getBossProgress
      tags: [Progress]
      summary: Selos e recompensas próprios, somente após replay verificado
      responses:
        "200":
          description: Progresso de chefes do titular da sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BossProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/regions:
    get:
      operationId: get_me_regions
      tags: [Profile]
      summary: Regioes alcançadas em replay VERIFIED, sem dados de outros jogadores
      responses:
        "200":
          description: Regioes desbloqueadas pelo dono da sessao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionUnlocks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /players/{player_id}/public:
    get:
      operationId: get_players_player_id_public
      tags:
        - Profile
      security: []
      summary: Somente dados publicos de perfil
      parameters:
        - name: player_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Nome publico, avatar sintetico e conquistas publicas
          content:
            application/json:
              schema:
                type: object
                required:
                  - player_id
                  - public_name
                properties:
                  player_id:
                    type: string
                    format: uuid
                  public_name:
                    type: string
                  avatar_parts:
                    type: object
                    additionalProperties:
                      type: string
                  achievements_public:
                    type: array
                    items:
                      type: string
  /me/export:
    post:
      operationId: post_me_export
      tags:
        - Profile
      summary: Solicitar exportacao de dados protegida
      responses:
        "202":
          description: Pedido aceito apos autenticacao recente quando necessario
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/delete-request:
    post:
      operationId: post_me_delete_request
      tags:
        - Profile
      summary: Solicitar exclusao de conta apos reautenticacao
      responses:
        "202":
          description: Pedido aceito com instrucoes e periodo de confirmacao
        "403":
          $ref: "#/components/responses/Forbidden"
  /me:
    get:
      operationId: get_me
      tags:
        - Profile
      summary: Perfil atual da identidade
      responses:
        "200":
          description: Perfil e configuracoes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: patch_me
      tags: [Profile]
      summary: Alterar apelido ou preferência de visibilidade do perfil
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Perfil persistido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /character/catalog:
    get:
      operationId: get_character_catalog
      tags:
        - Profile
      summary: Pecas basicas livres e cosmeticos desbloqueaveis
      security: []
      responses:
        "200":
          description: Catalogo versionado
          content:
            application/json:
              schema:
                type: object
                required:
                  - catalog_version
                  - parts
                properties:
                  catalog_version:
                    type: string
                  parts:
                    type: array
                    items:
                      $ref: "#/components/schemas/CharacterPart"
  /me/character:
    get:
      operationId: get_me_character
      tags:
        - Profile
      summary: Aparencia atual
      responses:
        "200":
          description: Equipamento atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
    patch:
      operationId: patch_me_character
      tags:
        - Profile
      summary: Atualizar IDs de pecas permitidas com controle de concorrencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterUpdate"
      responses:
        "200":
          description: Aparencia canonica atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /runs/start:
    post:
      operationId: post_runs_start
      tags:
        - Runs
      summary: Criar tentativa competitiva FULL ou REGIONAL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStart"
      responses:
        "201":
          description: Tentativa autorizada, seed e versoes do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTicket"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Retry idêntico devolve o ticket original sem criar outra tentativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTicket"
        "400":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,100}$
  /runs/{run_id}/segments/{index}:
    put:
      operationId: put_runs_run_id_segments_index
      tags:
        - Runs
      summary: Enviar bloco compacto de comandos em ticks
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: X-Start-Tick
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
        - name: X-End-Tick
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
        - name: X-Segment-Hash
          in: header
          required: true
          schema: &a1
            type: string
            pattern: ^[a-f0-9]{64}$
        - name: X-Previous-Segment-Hash
          in: header
          required: false
          schema: *a1
        - $ref: "#/components/parameters/CsrfToken"
        - name: Content-Encoding
          in: header
          required: false
          schema:
            type: string
            enum:
              - identity
              - gzip
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Segmento identico ja recebido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentAck"
        "201":
          description: Segmento persistido; ainda nao verificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentAck"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "400":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Erro de validação/autorização/estado ou indisponibilidade; código estável e message_key localizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Codec rr-input-v1 conforme ADR-002; headers devem coincidir com o envelope. Hash da representação
        canônica descomprimida, não dos bytes gzip. Limites aplicados em streaming antes/depois da
        descompressão.
  /runs/{run_id}/finish:
    post:
      operationId: post_runs_run_id_finish
